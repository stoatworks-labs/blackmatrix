# Build the site and put it in front of visitors.
#
# Until this existed, blackmatrix shipped only when somebody remembered to run
# `cf-run npx wrangler deploy` from a laptop.
#
# Two things are unusual here.
#
# First, the site is the SIMULATOR build: `sim:build` -> packages/web/dist-sim.
# Plain `build` produces the web app and the server for the real product, which
# is not what this Worker serves.
#
# Second, what is published is the SIMULATOR, never the product. A browser cannot
# open the UDP the ATEM protocol needs or the raw TCP the Videohub protocol needs,
# so a hosted BlackMatrix could not drive a switcher however it was built — the
# page says so in a banner. The hostname carries the -demo suffix for that reason,
# as atem-overseer-demo and caspar-av-demo do.
#
# That hostname was added on 2026-09-07. Until then this Worker had no domain at
# all and this workflow ended with a warning instead of a check, because there was
# no URL at which a deploy could be observed.
#
# Deliberately the same shape as the rest of the fleet's deploy.yml, so a fix to
# one is obvious in the others. See negative-space for the original.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run killed
# part way through never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/blackmatrix"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      - run: npm ci

      - run: npm test

      - run: npm run sim:build

      # A React major mismatch builds green and renders an empty page (RFutils #22,
      # three weeks of it). Unit tests run in node and cannot see that; this loads
      # the built site in a real browser.
      - name: Smoke-check the site
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: packages/web/dist-sim

      # wrangler is pinned rather than left to resolve to latest, and Dependabot's
      # github-actions ecosystem only bumps `uses:` refs, never a version inside a
      # `run:` — so bump this deliberately, in step with the rest of the fleet.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the domain a visitor uses. The whole body
      # cannot be compared: Cloudflare injects a bot-management script before
      # </body> carrying a per-request nonce, so no two responses are identical.
      #
      # -F on the grep is load-bearing. Without it the $ signs are read as
      # end-of-line anchors, the pattern matches nothing, and the filter silently
      # does nothing.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' packages/web/dist-sim/index.html \
                 | grep -vF '__CF$cv$params' | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://blackmatrix-demo.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | grep -vF '__CF$cv$params' \
                  | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://blackmatrix-demo.stoatworks-labs.com/ is"
          echo "::error::still not serving this build's <head>. The upload succeeded, so"
          echo "::error::this is the edge serving something else — check the Worker's routes."
          exit 1
