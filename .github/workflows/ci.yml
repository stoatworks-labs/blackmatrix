name: ci

# Typecheck, test, build and boot every workspace on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Typecheck, test and build all pass on a server that cannot start: a
      # route string is valid TypeScript whatever it says, and Express only
      # rejects it when the route is registered. That is how v0.3.1 through
      # v0.3.3 all shipped unable to boot at all. So start the built server the
      # way the packaged app does — node on dist/index.js, not npm start — and
      # ask it for pages.
      - name: Boot smoke-test
        run: node scripts/smoke-boot.mjs
