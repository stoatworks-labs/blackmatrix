# The hosted simulator — a Worker that serves a static build and nothing else.
#
# There is no server-side code here, and there cannot be anything useful: the
# simulator's whole point is that a browser cannot reach a switcher or a router.
# The ATEM protocol is UDP, the Videohub protocol is raw TCP, and the emulation
# this app offers panels has to *listen* on a port, which a web page cannot do
# at all. So the hosted build simulates devices in the tab and says so, loudly.
#
# Build with `npm run sim:build`, publish with `cf-run npx wrangler deploy`.
name = "blackmatrix"
compatibility_date = "2026-08-21"

[assets]
directory = "./packages/web/dist-sim"
# Deep links and reloads land on the app rather than a 404.
not_found_handling = "single-page-application"

# The public hostname for the demo, declared here rather than clicked into the
# dashboard, so it is reproducible from the repo and cannot drift from what is
# actually serving. `custom_domain = true` makes wrangler create the DNS record
# and the Worker custom domain on deploy.
#
# Added 2026-09-07. Until then this Worker had no hostname at all: it was the
# only simulator build in the fleet without one, so it deployed on every push and
# was reachable nowhere. The -demo suffix follows atem-overseer-demo,
# caspar-av-demo, srt-router-demo and the rest — what is published here is the
# in-browser simulator, never the product, because a web page cannot open the UDP
# the ATEM protocol needs or the raw TCP the Videohub protocol needs.
[[routes]]
pattern = "blackmatrix-demo.stoatworks-labs.com"
custom_domain = true
