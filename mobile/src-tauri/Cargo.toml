[package]
name = "blackmatrix-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
# Mobile needs a cdylib: the platform starts the app, not main().
name = "blackmatrix_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
tauri-plugin-opener = "2"
